line-length = 120
format.quote-style = "single"

# The oldest Python gilguard supports (requires-python in pyproject.toml): the 3.13t free-threaded build.
target-version = "py313"

# pycodestyle errors, Pyflakes and import sorting. Ruff's default excludes (venv, .venv, build, dist, caches) and
# .gitignore cover what shouldn't be checked.
lint.select = ["E", "F", "I"]
